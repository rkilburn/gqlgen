schema:
  - "testdata/perfield/schema.graphql"

exec:
  filename: testdata/perfield/out/ignored.go
model:
  filename: testdata/perfield/out/generated.go
resolver:
  type: CustomResolverType
  layout: follow-schema
  dir: testdata/perfield/out
  filename_template: "{field}_{object}.go"

models:
  Customer:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/perfield/out.Customer
    fields:
      name:
        resolver: true
      orders:
        resolver: true
      email:
        resolver: true
  Order:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/perfield/out.Order
    fields:
      total:
        resolver: true

omit_gqlgen_version_in_file_notice: true
