schema:
  - "testdata/operationfiles/schema.graphql"

exec:
  filename: testdata/operationfiles/out/ignored.go
model:
  filename: testdata/operationfiles/out/generated.go
resolver:
  type: CustomResolverType
  layout: follow-schema
  dir: testdata/operationfiles/out
  mutation_filename_template: "{field}_mutation.go"
  subscription_filename_template: "{field}_subscription.go"

models:
  Customer:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/operationfiles/out.Customer
    fields:
      name:
        resolver: true

omit_gqlgen_version_in_file_notice: true
