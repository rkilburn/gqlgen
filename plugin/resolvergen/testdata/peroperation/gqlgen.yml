schema:
  - "testdata/peroperation/schema.graphql"

exec:
  filename: testdata/peroperation/out/ignored.go
model:
  filename: testdata/peroperation/out/generated.go
resolver:
  type: CustomResolverType
  layout: follow-schema
  dir: testdata/peroperation/out
  filename_template: "{object}_resolver.go"
  operation_filename_template: "{field}_{object}.go"
  boilerplate_filename: resolvers.gen.go

models:
  Customer:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/peroperation/out.Customer
    fields:
      name: {resolver: true}
      orders: {resolver: true}
      email: {resolver: true}
  Order:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/peroperation/out.Order
    fields:
      total: {resolver: true}
      items: {resolver: true}
  OrderItem:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/peroperation/out.OrderItem
    fields:
      quantity: {resolver: true}
      product: {resolver: true}
  Product:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/peroperation/out.Product
    fields:
      name: {resolver: true}
      supplier: {resolver: true}
  Supplier:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/peroperation/out.Supplier
    fields:
      name: {resolver: true}

omit_gqlgen_version_in_file_notice: true
