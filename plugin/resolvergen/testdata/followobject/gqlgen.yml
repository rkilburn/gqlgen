schema:
  - "testdata/followobject/schema.graphql"

exec:
  filename: testdata/followobject/out/ignored.go
model:
  filename: testdata/followobject/out/generated.go
resolver:
  type: CustomResolverType
  layout: follow-object
  dir: testdata/followobject/out

models:
  Customer:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/followobject/out.Customer
    fields:
      name: {resolver: true}
      orders: {resolver: true}
      email: {resolver: true}
  Order:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/followobject/out.Order
    fields:
      total: {resolver: true}
      items: {resolver: true}
  OrderItem:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/followobject/out.OrderItem
    fields:
      quantity: {resolver: true}
      product: {resolver: true}
  Product:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/followobject/out.Product
    fields:
      name: {resolver: true}
      supplier: {resolver: true}
  Supplier:
    model: github.com/99designs/gqlgen/plugin/resolvergen/testdata/followobject/out.Supplier
    fields:
      name: {resolver: true}

omit_gqlgen_version_in_file_notice: true
